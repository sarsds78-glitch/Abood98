services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: iraq-waz-postgres
    environment:
      POSTGRES_DB: iraq_waz
      POSTGRES_USER: iraq_waz
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - iraq_waz_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iraq_waz -d iraq_waz"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: iraq-waz-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - iraq_waz_redisdata:/data
volumes:
  iraq_waz_pgdata:
  iraq_waz_redisdata:
